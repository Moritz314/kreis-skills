<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H13 Built: CSS 3D to WebGL</title>
<!--
Baustein H13: Built: CSS 3D to WebGL
Zweck: Scroll section with four steps: Design, Agents, Core, Window. The wire globe contracts and the real blob grows out of it. Scroll back and it runs in reverse. Follows the page theme. Enthaelt H8 (WebGL-Blob) und BAU (Abschnitt) inline.
Herkunft: plasmind Elementeschau 2026-10-03 (<studio>, eigenes Werk).
In sich geschlossen: CSS und JS inline, keine externen Abrufe. Farben ueber die CSS-Variablen im Tokenblock
(dunkel, hell ueber [data-theme=light]); die Schrift faellt auf ui-monospace zurueck.
API: PMEL.H13.init(el,{theme:'dark'|'light'}) liefert ein Handle mit setTheme(t) und destroy()
(set(name,wert) fuer Optionen, falls vorhanden). el braucht position:relative und eine Hoehe.
Pausiert ausserhalb des Bildschirms und im verdeckten Tab, Standbild bei prefers-reduced-motion.
URL-Parameter: ?theme=light
-->
<style>
/* Tokenblock */
:root{
  color-scheme: dark;
  
  --bg:          oklch(0.085 0.008 262);
  --bg-sunk:     oklch(0.052 0.008 262);
  --surface:     oklch(0.115 0.008 262);
  --surface-2:   oklch(0.15 0.008 262);
  --surface-3:   oklch(0.185 0.008 262);
  --line:        oklch(0.235 0.008 262);
  --line-strong: oklch(0.37 0.008 262);
  --fg-mute:     oklch(0.62 0.008 262);
  --fg-soft:     oklch(0.8 0.004 262);
  --fg:          oklch(0.975 0.004 262);
  --cell-fill:   oklch(0.098 0.008 262);
  --flood:       oklch(0.97 0.004 262);
  --shadow:      oklch(0.02 0.008 262 / 0.55);
  --inv-bg: var(--fg);   
  --inv-fg: var(--bg);

  
  --mark-hell:  #F5F7F9;
  --mark-dunkel:#050608;
  --splash-grund:#020203;

  
  --sel-bg:   oklch(0.27 0.006 262);
  --sel-edge: 6px;      
  --sel-edge-a: 0.55;   

  
  --pm-fill: oklch(0.17 0.006 262);
  --pm-fill-a: 0.88;

  
  --font: "Martian Mono", ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --fsa: 0.516;         

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 420ms;
  --r-ctl: 4px;
  --r-tile: 8px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:          oklch(0.962 0.005 262);
  --bg-sunk:     oklch(0.985 0.005 262);
  --surface:     oklch(0.982 0.005 262);
  --surface-2:   oklch(0.935 0.005 262);
  --surface-3:   oklch(0.905 0.005 262);
  --line:        oklch(0.855 0.005 262);
  --line-strong: oklch(0.72 0.005 262);
  --fg-mute:     oklch(0.47 0.005 262);
  --fg-soft:     oklch(0.3 0.006 262);
  --fg:          oklch(0.12 0.006 262);
  --cell-fill:   oklch(0.978 0.005 262);
  --flood:       oklch(0.97 0.006 262);
  --shadow:      oklch(0.3 0.005 262 / 0.18);
  --pm-fill: oklch(0.978 0.005 262);
  --sel-bg:  oklch(0.86 0.006 262);  
}

html{
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size-adjust: var(--fsa);
  font-weight: 400;
}
body{ margin:0; background:var(--bg); color:var(--fg); }


::selection{
  background: var(--sel-bg);
  color: var(--fg);
  text-shadow: 0 0 6px oklch(0.975 0.004 262 / 0.9), 0 0 14px oklch(0.975 0.004 262 / 0.5);
}
:root[data-theme="light"] ::selection{ text-shadow:none; }
.pm-sel-aktiv ::selection, .pm-sel-aktiv::selection{ background: transparent; } 

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0ms !important; }
}
/* Seitengeruest der Demo */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-size:13px;line-height:1.6}
.bar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar b{font-weight:600}.bar span{color:var(--fg-mute);font-size:12px}.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-ctl);overflow:hidden}
.seg button{font:500 12px/1 var(--font);padding:7px 11px;border:0;background:transparent;color:var(--fg-soft);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.opt{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--fg-soft);cursor:pointer}
.opt input{accent-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
#stage{position:relative;overflow:visible;flex:none;min-height:0px;background:var(--bg-sunk)}
/* plasmind element H13: How plasmind was built. Scroll section, wire globe (CSS 3D) turns into the blob (WebGL). */
.bau{position:relative;color:var(--fg);background:var(--bg)}
.bau-track{position:relative;height:440vh}
.bau-stick{position:sticky;top:var(--bau-top,0px);height:calc(100vh - var(--bau-top,0px));min-height:520px;overflow:hidden;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(16px,4vw,64px);align-items:center;padding:0 clamp(20px,5vw,72px)}
.bau-copy{position:relative;display:flex;flex-direction:column;gap:clamp(18px,3vh,34px);min-width:0}
.bau-h{font:600 clamp(22px,2.6vw,34px)/1.15 var(--font,"Martian Mono",ui-monospace,monospace);margin:0;letter-spacing:-.01em}
.bau-steps{position:relative;min-height:15em}
.bau-step{position:absolute;left:0;right:0;top:0;opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
.bau-step.on{opacity:1;transform:none;pointer-events:auto}
.bau-step .n{font:500 12px/1 var(--font,monospace);color:var(--fg-mute);letter-spacing:.08em}
.bau-step h3{font:600 clamp(20px,2vw,26px)/1.2 var(--font,monospace);margin:.5em 0 .6em}
.bau-step p{margin:0;max-width:44ch;font:400 clamp(13px,1.15vw,15px)/1.7 var(--font,monospace);color:var(--fg-soft)}
.bau-dots{display:flex;gap:10px}
.bau-dots i{display:block;width:34px;height:2px;background:var(--line-strong,var(--line));position:relative;overflow:hidden}
.bau-dots i::after{content:"";position:absolute;inset:0;background:var(--fg);transform:scaleX(var(--f,0));transform-origin:left}
.bau-vis{position:relative;width:min(100%,62vh,560px);aspect-ratio:1;justify-self:center}
.bau-wire,.bau-gl{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform,opacity}
.bau-gl{opacity:0}
.bau-cap{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font:400 11px/1.4 var(--font,monospace);color:var(--fg-mute)}
/* ruhiger Modus: vier Stufen untereinander mit Standbildern */
.bau.still .bau-track{height:auto}
.bau.still .bau-stick{position:static;height:auto;min-height:0;display:block;overflow:visible;padding:clamp(40px,8vw,96px) clamp(20px,5vw,72px)}
.bau.still .bau-copy{gap:clamp(28px,5vw,56px)}
.bau.still .bau-steps{min-height:0;display:grid;gap:clamp(36px,6vw,72px)}
.bau.still .bau-step{position:static;opacity:1;transform:none;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(16px,4vw,64px);align-items:center}
.bau.still .bau-step .txt{min-width:0}
.bau.still .bau-vis{width:min(100%,360px)}
.bau.still .bau-dots,.bau.still .bau-cap{display:none}
.bau:not(.still) .bau-step .bau-vis{display:none}
@media (max-width:760px){
 .bau-stick{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46vh) auto;align-content:start;padding-top:max(14px,2vh);gap:10px}
 .bau-vis{width:min(100%,40vh,320px);order:-1}
 .bau-copy{gap:12px}.bau-h{font-size:19px}.bau-steps{min-height:14em}
 .bau.still .bau-step{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.bau-step{transition:none}}
