<!doctype html>
<!--
Kennung:  F5
Name:     Zahlentafel
Zweck:    Vier Kacheln mit zählenden Zahlen und Verlaufslinien aus erfundenen, selbst bewegten Beispieldaten.
Herkunft: plasmind Elementeschau 2026-10-03 (Featureseite)
Bedienung: Pause hält die Aktualisierung an, Resume setzt sie fort; bei reduzierter Bewegung gibt es stattdessen Update once.
Aufbau:   ein Dokument, CSS und JS inline, keine externen Abrufe, keine Abhängigkeit von plasmind.js oder base.css.
          Dunkel ist Standard, ?theme=light schaltet auf hell.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F5 Zahlentafel</title>
<script>
(function(){try{if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();
</script>
<style>
/* Tokens (aus tokens.css) */
:root{
  color-scheme: dark;
  /* Dunkelfeld (Standard). Hue 262, kein reines Schwarz/Weiss. */
  --bg:          oklch(0.085 0.008 262);
  --bg-sunk:     oklch(0.052 0.008 262);
  --surface:     oklch(0.115 0.008 262);
  --surface-2:   oklch(0.15 0.008 262);
  --surface-3:   oklch(0.185 0.008 262);
  --line:        oklch(0.235 0.008 262);
  --line-strong: oklch(0.37 0.008 262);
  --fg-mute:     oklch(0.62 0.008 262);
  --fg-soft:     oklch(0.8 0.004 262);
  --fg:          oklch(0.975 0.004 262);
  --cell-fill:   oklch(0.098 0.008 262);
  --flood:       oklch(0.97 0.004 262);
  --shadow:      oklch(0.02 0.008 262 / 0.55);
  --inv-bg: var(--fg);   /* Umkehrfläche: hell auf dunkel */
  --inv-fg: var(--bg);

  /* Zeichenfarben des Logos (Hex aus dem Logo-Generator w12.py) */
  --mark-hell:  #F5F7F9;
  --mark-dunkel:#050608;
  --splash-grund:#020203;

  /* Textauswahl W2d2 */
  --sel-bg:   oklch(0.27 0.006 262);
  --sel-edge: 6px;      /* Kantenbreite */
  --sel-edge-a: 0.55;   /* Kantendeckkraft */

  /* Cursor / Ladezeichen (Blob-Füllung) */
  --pm-fill: oklch(0.17 0.006 262);
  --pm-fill-a: 0.88;

  /* Schrift: Martian Mono für alles, Größenausgleich über x-Höhe (PUNKT-33) */
  --font: "Martian Mono", ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --fsa: 0.516;         /* font-size-adjust: x-Höhe von IBM Plex; Martian Mono x-Höhe 0,600 = Faktor 0,86 */

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 420ms;
  --r-ctl: 4px;
  --r-tile: 8px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:          oklch(0.962 0.005 262);
  --bg-sunk:     oklch(0.985 0.005 262);
  --surface:     oklch(0.982 0.005 262);
  --surface-2:   oklch(0.935 0.005 262);
  --surface-3:   oklch(0.905 0.005 262);
  --line:        oklch(0.855 0.005 262);
  --line-strong: oklch(0.72 0.005 262);
  --fg-mute:     oklch(0.47 0.005 262);
  --fg-soft:     oklch(0.3 0.006 262);
  --fg:          oklch(0.12 0.006 262);
  --cell-fill:   oklch(0.978 0.005 262);
  --flood:       oklch(0.97 0.006 262);
  --shadow:      oklch(0.3 0.005 262 / 0.18);
  --pm-fill: oklch(0.978 0.005 262);
  --sel-bg:  oklch(0.86 0.006 262);  /* Hellfeld ist in der Marke nicht festgelegt: eigene Annahme */
}
::selection{
  background: var(--sel-bg);
  color: var(--fg);
  text-shadow: 0 0 6px oklch(0.975 0.004 262 / 0.9), 0 0 14px oklch(0.975 0.004 262 / 0.5);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color:var(--fg);font-family:"Martian Mono",ui-monospace,monospace;font-size-adjust:var(--fsa);font-weight:400}
body{margin:0;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.65;min-height:100vh}
img,svg,canvas{max-width:100%}
h1,h2,h3,p,ul,ol,dl,figure{margin:0}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:2px}
button,input,textarea{font:inherit}
.stage{max-width:760px;margin:0 auto;padding:24px 16px 40px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:0ms!important}}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:12px;font-weight:500;color:var(--fg);background:transparent;border:1px solid var(--line-strong);border-radius:var(--r-ctl);min-height:36px;padding:0 16px;text-decoration:none;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast)}
.knopf:hover{background:var(--surface-2);border-color:var(--fg-mute)}
.knopf--voll{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.knopf--voll:hover{background:var(--fg-soft);border-color:var(--fg-soft)}
.knopf[disabled]{opacity:.45;cursor:not-allowed;border-style:dashed}
.knopf--link{border:0;padding:4px 0;min-height:0;background:none;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:.3em;font-weight:400;color:var(--fg-mute)}
.knopf--link:hover{color:var(--fg);background:none}
.pille{font:inherit;font-size:11px;color:var(--fg-soft);background:transparent;border:1px solid var(--line-strong);border-radius:99px;padding:6px 12px;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast)}
.pille:hover{background:var(--surface-2);border-color:var(--fg-mute)}
input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-ctl);padding:8px 12px;min-height:38px;width:100%}
input::placeholder{color:var(--fg-mute)}
input[type=range]{width:100%;accent-color:var(--fg)}
.fx-demo{margin:0;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--surface);min-width:0;overflow:clip}
.fx-bar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.fx-id{font-weight:600;min-width:2.4em;padding:2px 8px;border:1px solid var(--fg);border-radius:var(--r-ctl);line-height:1.4;text-align:center}
.fx-art{color:var(--fg-soft);flex:1;min-width:10em}
.fx-body{padding:clamp(16px,3vw,32px);min-width:0}
.fx-foot{display:flex;gap:16px;align-items:center;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--fg-mute);flex-wrap:wrap}
.fx-ex{white-space:nowrap}
.fx-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0}
.fx-lab{display:block;margin:0 0 8px;font-size:11px;letter-spacing:.06em;color:var(--fg-mute)}
.fx-input{width:100%;min-height:38px;padding:8px 12px;background:var(--bg);font-size:12px}
.fx-row .fx-input{flex:1;min-width:12em;width:auto}
.fx-area{resize:vertical;line-height:1.6}
.fx-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.fx-status{margin:18px 0 0;min-height:1.6em;font-size:12px;line-height:1.6;color:var(--fg-soft)}
.fx-hint{margin:0 0 20px;font-size:12px;line-height:1.7;color:var(--fg-mute)}
.fx-state{font-size:12px;color:var(--fg-mute)}
.fx-badge{display:inline-block;margin:0 0 20px;padding:4px 12px;border:1px dashed var(--line-strong);border-radius:99px;font-size:11px;color:var(--fg-soft)}
.fx-prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px}
.fx-prog i{display:block;height:100%;width:0;background:var(--fg);transform-origin:left}
.fx-stand{display:inline-block;padding:1px 9px;border:1px solid var(--line-strong);border-radius:99px;font-size:11px;color:var(--fg-soft);line-height:1.6}
.fx-stand[data-stand="planned"]{border-style:dashed}
/* F5 */
.fx-board{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:20px}
.fx-tile{padding:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.fx-tile-l{margin:0 0 10px;font-size:11px;color:var(--fg-mute);line-height:1.5}
.fx-tile-n{margin:0 0 12px;font-size:clamp(22px,3.4vw,34px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fx-tile canvas{display:block;width:100%;height:48px}
@media (max-width:600px){.fx-board{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main class="stage">
<figure class="fx-demo" id="F5" data-fx="board" aria-labelledby="F5-t">
      <div class="fx-bar"><span class="fx-id">F5</span><span class="fx-art" id="F5-t">Live numbers board</span></div>
      <div class="fx-body">
        <p class="fx-badge">Example data. These numbers move on their own. They are not measurements.</p>
        <div class="fx-board">
          <div class="fx-tile" data-tile="tokens"><p class="fx-tile-l">Tokens, last 60 min</p><p class="fx-tile-n" data-tile-n>0</p><canvas width="240" height="48" aria-hidden="true"></canvas></div>
          <div class="fx-tile" data-tile="agents"><p class="fx-tile-l">Agents working</p><p class="fx-tile-n" data-tile-n>0</p><canvas width="240" height="48" aria-hidden="true"></canvas></div>
          <div class="fx-tile" data-tile="decisions"><p class="fx-tile-l">Small decisions per minute</p><p class="fx-tile-n" data-tile-n>0</p><canvas width="240" height="48" aria-hidden="true"></canvas></div>
          <div class="fx-tile" data-tile="nodes"><p class="fx-tile-l">Nodes online <span class="fx-stand" data-stand="planned">planned</span></p><p class="fx-tile-n" data-tile-n>0</p><canvas width="240" height="48" aria-hidden="true"></canvas></div>
        </div>
        <p class="fx-row"><button class="knopf" type="button" data-board-pause aria-pressed="false">Pause</button></p>
      </div>
      <div class="fx-foot"><span class="fx-ex">example data</span></div>
    </figure>
</main>
<script>
(function () {
  'use strict';
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function tween(ms, fn, done) {
    if (reduced || ms <= 0) { fn(1); if (done) done(); return; }
    var t0 = performance.now();
    (function f(ts) {
      var k = clamp((ts - t0) / ms, 0, 1);
      fn(1 - Math.pow(1 - k, 3));
      if (k < 1) requestAnimationFrame(f); else if (done) done();
    })(t0);
  }
  function loop(fn, el, force) {
    var run = false, vis = true, raf = 0, last = 0;
    var io = new IntersectionObserver(function (es) { vis = es[0].isIntersecting; sync(); }, { rootMargin: '80px' });
    io.observe(el);
    document.addEventListener('visibilitychange', sync);
    function tick(ts) { if (!run) return; var dt = ts - last; last = ts; fn(ts, dt); raf = requestAnimationFrame(tick); }
    function sync() {
      var want = vis && !document.hidden && (force || !reduced);
      if (want && !run) { run = true; last = performance.now(); raf = requestAnimationFrame(tick); }
      else if (!want && run) { run = false; cancelAnimationFrame(raf); }
    }
    if (!force && reduced) setTimeout(function () { fn(performance.now(), 0); }, 0);
    return { stop: function () { run = false; cancelAnimationFrame(raf); io.disconnect(); }, draw: function () { fn(performance.now(), 0); } };
  }
  function once(el, fn, margin) {
    var io = new IntersectionObserver(function (es) {
      if (es[0].isIntersecting) { io.disconnect(); fn(); }
    }, { rootMargin: margin || '0px' });
    io.observe(el);
  }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function themeWatch(fn) {
    new MutationObserver(fn).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }

  function initBoard() {
    var root = $('#F5'); if (!root) return;
    var tiles = $$('.fx-tile', root).map(function (t) {
      return { el: t, n: $('[data-tile-n]', t), cv: $('canvas', t), key: t.getAttribute('data-tile') };
    });
    var cfg = {
      tokens: { v: 412300, lo: 300000, hi: 520000, step: 14000, fmt: fmt },
      agents: { v: 7, lo: 4, hi: 11, step: 1.1, fmt: function (x) { return String(Math.round(x)); } },
      decisions: { v: 176, lo: 120, hi: 200, step: 9, fmt: fmt },
      nodes: { v: 3, lo: 2, hi: 4, step: 0.5, fmt: function (x) { return String(Math.round(x)); } }
    };
    var N = 60;
    tiles.forEach(function (t) { var c = cfg[t.key]; t.c = c; t.hist = []; for (var i = 0; i < N; i++) { c.v = clamp(c.v + (Math.random() - 0.5) * c.step * 0.8, c.lo, c.hi); t.hist.push(c.v); } t.target = c.v; t.cur = c.v; });
    var running = !reduced, paused = false, lastTick = 0, col = {};
    function colors() { col.fg = cssVar('--fg'); col.line = cssVar('--line-strong'); col.mute = cssVar('--fg-mute'); }
    colors(); themeWatch(colors);
    function size() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      tiles.forEach(function (t) { var w = t.cv.clientWidth || 240; t.cv.width = Math.round(w * dpr); t.cv.height = Math.round(48 * dpr); t.dpr = dpr; });
    }
    size(); window.addEventListener('resize', function () { size(); tiles.forEach(function (t) { drawSpark(t, 0); }); });
    function tick() {
      tiles.forEach(function (t) {
        var c = t.c; c.v = clamp(c.v + (Math.random() - 0.5) * c.step, c.lo, c.hi);
        if (t.key === 'nodes' && Math.random() < 0.8) c.v = Math.round(t.cur);
        t.hist.push(c.v); t.hist.shift(); t.target = c.v;
      });
    }
    function drawSpark(t, frac) {
      var cv = t.cv, g = cv.getContext('2d'), w = cv.width, hh = cv.height;
      g.clearRect(0, 0, w, hh);
      var c = t.c, span = c.hi - c.lo || 1, dpr = t.dpr;
      g.strokeStyle = col.line; g.lineWidth = dpr; g.setLineDash([2 * dpr, 4 * dpr]); g.beginPath(); g.moveTo(0, hh - dpr); g.lineTo(w, hh - dpr); g.stroke(); g.setLineDash([]);
      g.strokeStyle = col.fg; g.lineWidth = 1.6 * dpr; g.lineJoin = 'round'; g.beginPath();
      var step = w / (N - 2);
      for (var i = 0; i < N; i++) {
        var x = (i - frac) * step, y = hh - 4 * dpr - ((t.hist[i] - c.lo) / span) * (hh - 10 * dpr);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
    function frame(ts) {
      if (!lastTick) lastTick = ts;
      var frac = 0;
      if (running && !paused) { if (ts - lastTick > 1100) { lastTick = ts; tick(); } frac = clamp((ts - lastTick) / 1100, 0, 1); }
      tiles.forEach(function (t) {
        t.cur += (t.target - t.cur) * 0.12; if (Math.abs(t.target - t.cur) < 0.5) t.cur = t.target;
        if (t.show) t.n.textContent = t.c.fmt(t.cur);
        drawSpark(t, frac);
      });
    }
    var shown = false;
    once(root, function () {
      tiles.forEach(function (t, i) {
        var fin = Math.round(t.target);
        tween(1200, function (k) { t.n.textContent = t.c.fmt(fin * k); });
        setTimeout(function () { t.show = true; }, reduced ? 0 : 1300);
      });
      shown = true;
    }, '-60px');
    tiles.forEach(function (t) { t.n.textContent = t.c.fmt(t.cur); t.show = false; });
    loop(frame, $('.fx-board', root));
    var pb = $('[data-board-pause]', root);
    if (reduced) { pb.textContent = 'Update once'; pb.addEventListener('click', function () { tick(); tiles.forEach(function (t) { t.cur = t.target; t.n.textContent = t.c.fmt(t.cur); drawSpark(t, 0); }); }); setTimeout(function () { tiles.forEach(function (t) { t.show = true; t.n.textContent = t.c.fmt(t.cur); }); }, 50); }
    else pb.addEventListener('click', function () { paused = !paused; pb.setAttribute('aria-pressed', paused); pb.textContent = paused ? 'Resume' : 'Pause'; });
  }
  initBoard();
})();
</script>
</body>
</html>
