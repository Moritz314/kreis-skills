<!doctype html>
<!--
Kennung:  F1
Name:     Mini-Overseer
Zweck:    Aus einem getippten Auftrag zerlegt ein Overseer-Blob die Arbeit in vier Briefings für Agenten, einer wartet auf das Ja des Nutzers.
Herkunft: plasmind Elementeschau 2026-10-03 (Featureseite)
Bedienung: Auftrag tippen und Split drücken oder ein Beispiel-Chip antippen; Yes gibt die wartende Aktion einmal frei. Keine API.
Aufbau:   ein Dokument, CSS und JS inline, keine externen Abrufe, keine Abhängigkeit von plasmind.js oder base.css.
          Dunkel ist Standard, ?theme=light schaltet auf hell.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Mini-Overseer</title>
<script>
(function(){try{if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();
</script>
<style>
/* Tokens (aus tokens.css) */
:root{
  color-scheme: dark;
  /* Dunkelfeld (Standard). Hue 262, kein reines Schwarz/Weiss. */
  --bg:          oklch(0.085 0.008 262);
  --bg-sunk:     oklch(0.052 0.008 262);
  --surface:     oklch(0.115 0.008 262);
  --surface-2:   oklch(0.15 0.008 262);
  --surface-3:   oklch(0.185 0.008 262);
  --line:        oklch(0.235 0.008 262);
  --line-strong: oklch(0.37 0.008 262);
  --fg-mute:     oklch(0.62 0.008 262);
  --fg-soft:     oklch(0.8 0.004 262);
  --fg:          oklch(0.975 0.004 262);
  --cell-fill:   oklch(0.098 0.008 262);
  --flood:       oklch(0.97 0.004 262);
  --shadow:      oklch(0.02 0.008 262 / 0.55);
  --inv-bg: var(--fg);   /* Umkehrfläche: hell auf dunkel */
  --inv-fg: var(--bg);

  /* Zeichenfarben des Logos (Hex aus dem Logo-Generator w12.py) */
  --mark-hell:  #F5F7F9;
  --mark-dunkel:#050608;
  --splash-grund:#020203;

  /* Textauswahl W2d2 */
  --sel-bg:   oklch(0.27 0.006 262);
  --sel-edge: 6px;      /* Kantenbreite */
  --sel-edge-a: 0.55;   /* Kantendeckkraft */

  /* Cursor / Ladezeichen (Blob-Füllung) */
  --pm-fill: oklch(0.17 0.006 262);
  --pm-fill-a: 0.88;

  /* Schrift: Martian Mono für alles, Größenausgleich über x-Höhe (PUNKT-33) */
  --font: "Martian Mono", ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --fsa: 0.516;         /* font-size-adjust: x-Höhe von IBM Plex; Martian Mono x-Höhe 0,600 = Faktor 0,86 */

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 420ms;
  --r-ctl: 4px;
  --r-tile: 8px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:          oklch(0.962 0.005 262);
  --bg-sunk:     oklch(0.985 0.005 262);
  --surface:     oklch(0.982 0.005 262);
  --surface-2:   oklch(0.935 0.005 262);
  --surface-3:   oklch(0.905 0.005 262);
  --line:        oklch(0.855 0.005 262);
  --line-strong: oklch(0.72 0.005 262);
  --fg-mute:     oklch(0.47 0.005 262);
  --fg-soft:     oklch(0.3 0.006 262);
  --fg:          oklch(0.12 0.006 262);
  --cell-fill:   oklch(0.978 0.005 262);
  --flood:       oklch(0.97 0.006 262);
  --shadow:      oklch(0.3 0.005 262 / 0.18);
  --pm-fill: oklch(0.978 0.005 262);
  --sel-bg:  oklch(0.86 0.006 262);  /* Hellfeld ist in der Marke nicht festgelegt: eigene Annahme */
}
::selection{
  background: var(--sel-bg);
  color: var(--fg);
  text-shadow: 0 0 6px oklch(0.975 0.004 262 / 0.9), 0 0 14px oklch(0.975 0.004 262 / 0.5);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color:var(--fg);font-family:"Martian Mono",ui-monospace,monospace;font-size-adjust:var(--fsa);font-weight:400}
body{margin:0;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.65;min-height:100vh}
img,svg,canvas{max-width:100%}
h1,h2,h3,p,ul,ol,dl,figure{margin:0}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:2px}
button,input,textarea{font:inherit}
.stage{max-width:760px;margin:0 auto;padding:24px 16px 40px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:0ms!important}}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:12px;font-weight:500;color:var(--fg);background:transparent;border:1px solid var(--line-strong);border-radius:var(--r-ctl);min-height:36px;padding:0 16px;text-decoration:none;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast)}
.knopf:hover{background:var(--surface-2);border-color:var(--fg-mute)}
.knopf--voll{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.knopf--voll:hover{background:var(--fg-soft);border-color:var(--fg-soft)}
.knopf[disabled]{opacity:.45;cursor:not-allowed;border-style:dashed}
.knopf--link{border:0;padding:4px 0;min-height:0;background:none;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:.3em;font-weight:400;color:var(--fg-mute)}
.knopf--link:hover{color:var(--fg);background:none}
.pille{font:inherit;font-size:11px;color:var(--fg-soft);background:transparent;border:1px solid var(--line-strong);border-radius:99px;padding:6px 12px;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast)}
.pille:hover{background:var(--surface-2);border-color:var(--fg-mute)}
input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-ctl);padding:8px 12px;min-height:38px;width:100%}
input::placeholder{color:var(--fg-mute)}
input[type=range]{width:100%;accent-color:var(--fg)}
.fx-demo{margin:0;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--surface);min-width:0;overflow:clip}
.fx-bar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.fx-id{font-weight:600;min-width:2.4em;padding:2px 8px;border:1px solid var(--fg);border-radius:var(--r-ctl);line-height:1.4;text-align:center}
.fx-art{color:var(--fg-soft);flex:1;min-width:10em}
.fx-body{padding:clamp(16px,3vw,32px);min-width:0}
.fx-foot{display:flex;gap:16px;align-items:center;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--fg-mute);flex-wrap:wrap}
.fx-ex{white-space:nowrap}
.fx-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0}
.fx-lab{display:block;margin:0 0 8px;font-size:11px;letter-spacing:.06em;color:var(--fg-mute)}
.fx-input{width:100%;min-height:38px;padding:8px 12px;background:var(--bg);font-size:12px}
.fx-row .fx-input{flex:1;min-width:12em;width:auto}
.fx-area{resize:vertical;line-height:1.6}
.fx-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.fx-status{margin:18px 0 0;min-height:1.6em;font-size:12px;line-height:1.6;color:var(--fg-soft)}
.fx-hint{margin:0 0 20px;font-size:12px;line-height:1.7;color:var(--fg-mute)}
.fx-state{font-size:12px;color:var(--fg-mute)}
.fx-badge{display:inline-block;margin:0 0 20px;padding:4px 12px;border:1px dashed var(--line-strong);border-radius:99px;font-size:11px;color:var(--fg-soft)}
.fx-prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px}
.fx-prog i{display:block;height:100%;width:0;background:var(--fg);transform-origin:left}
.fx-stand{display:inline-block;padding:1px 9px;border:1px solid var(--line-strong);border-radius:99px;font-size:11px;color:var(--fg-soft);line-height:1.6}
.fx-stand[data-stand="planned"]{border-style:dashed}
/* F1 */
.fx-mini-stage{position:relative;margin-top:24px;min-height:300px;padding:clamp(8px,2vw,20px) 4px;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--bg-sunk);overflow:hidden}
.fx-btn{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line-strong);border-radius:var(--r-ctl);padding:0 16px;min-height:36px;color:var(--fg);background:transparent}
.fx-btn-solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fx-yes{position:absolute;right:16px;bottom:16px}
.fx-mini-stage svg{width:100%;height:auto;display:block;max-height:300px}
.fx-mini-stage text{fill:var(--fg);font-family:inherit}
</style>
</head>
<body>
<main class="stage">
<figure class="fx-demo" id="F1" data-fx="mini" aria-labelledby="F1-t">
      <div class="fx-bar"><span class="fx-id">F1</span><span class="fx-art" id="F1-t">Interactive in the browser</span></div>
      <div class="fx-body">
        <form class="fx-mini-form" data-mini-form>
          <label for="F1-in" class="fx-lab">Describe the work</label>
          <div class="fx-row">
            <input id="F1-in" class="fx-input" type="text" maxlength="90" autocomplete="off" placeholder="Plan a release note, check the tests, tell the team">
            <button class="knopf knopf--voll" type="submit">Split</button>
          </div>
          <div class="fx-chips" role="group" aria-label="Examples">
            <button type="button" class="pille fx-chip" data-ex="Prepare the release, check the tests, write the note">Prepare a release</button>
            <button type="button" class="pille fx-chip" data-ex="Collect the invoices, compare them with the orders, draft the reply">Check invoices</button>
            <button type="button" class="pille fx-chip" data-ex="Clean up the folder, sort the files, report what changed">Tidy a folder</button>
          </div>
        </form>
        <div class="fx-stage fx-mini-stage" data-mini-stage></div>
        <p class="fx-status" data-mini-status role="status" aria-live="polite">Type a task or tap an example. One agent waits for your yes.</p>
      </div>
      <div class="fx-foot"><span class="fx-ex">example data</span></div>
    </figure>
</main>
<script>
(function () {
  'use strict';
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = Math.PI * 2;
  var SVGNS = 'http://www.w3.org/2000/svg';

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function sv(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function tween(ms, fn, done) {
    if (reduced || ms <= 0) { fn(1); if (done) done(); return; }
    var t0 = performance.now();
    (function f(ts) {
      var k = clamp((ts - t0) / ms, 0, 1);
      fn(1 - Math.pow(1 - k, 3));
      if (k < 1) requestAnimationFrame(f); else if (done) done();
    })(t0);
  }
  function loop(fn, el, force) {
    var run = false, vis = true, raf = 0, last = 0;
    var io = new IntersectionObserver(function (es) { vis = es[0].isIntersecting; sync(); }, { rootMargin: '80px' });
    io.observe(el);
    document.addEventListener('visibilitychange', sync);
    function tick(ts) { if (!run) return; var dt = ts - last; last = ts; fn(ts, dt); raf = requestAnimationFrame(tick); }
    function sync() {
      var want = vis && !document.hidden && (force || !reduced);
      if (want && !run) { run = true; last = performance.now(); raf = requestAnimationFrame(tick); }
      else if (!want && run) { run = false; cancelAnimationFrame(raf); }
    }
    if (!force && reduced) setTimeout(function () { fn(performance.now(), 0); }, 0);
    return { stop: function () { run = false; cancelAnimationFrame(raf); io.disconnect(); }, draw: function () { fn(performance.now(), 0); } };
  }
  function blobD(r, seed, t, amp) {
    var n = 10, p = [], i;
    for (i = 0; i < n; i++) {
      var a = i / n * TAU;
      var w = 1 + amp * (Math.sin(a * 2 + seed + t * 1.1) * 0.6 + Math.sin(a * 3 - seed * 1.7 + t * 0.8) * 0.4);
      p.push([Math.cos(a) * r * w, Math.sin(a) * r * w]);
    }
    var d = 'M' + p[0][0].toFixed(1) + ' ' + p[0][1].toFixed(1);
    for (i = 0; i < n; i++) {
      var p0 = p[(i + n - 1) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
      d += 'C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' +
        (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' +
        p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d + 'Z';
  }
  function makeCell(parent, x, y, r, seed, opts) {
    opts = opts || {};
    var g = sv('g', { transform: 'translate(' + x + ' ' + y + ')' }, parent);
    var body = sv('path', { d: blobD(r, seed, 0, 0.05), fill: 'var(--cell-fill)', stroke: 'var(--fg)', 'stroke-width': opts.sw || 2 }, g);
    var eyeG = sv('g', {}, g), eyes = [];
    if (opts.eyes !== false) {
      [-0.2, 0.2].forEach(function (o) {
        eyes.push(sv('ellipse', { cx: o * r, cy: -0.06 * r, rx: r * 0.075, ry: r * 0.11, fill: 'var(--fg)' }, eyeG));
      });
    }
    return { g: g, body: body, eyes: eyes, r: r, seed: seed, setPos: function (px, py) { g.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) + ')'); } };
  }
  function eyesState(cell, open) {
    cell.eyes.forEach(function (e) {
      var r = cell.r;
      if (open) { e.setAttribute('ry', r * 0.11); e.setAttribute('rx', r * 0.075); e.setAttribute('opacity', 1); }
      else { e.setAttribute('ry', r * 0.014); e.setAttribute('rx', r * 0.1); e.setAttribute('opacity', 0.8); }
    });
  }
  function setStatus(el, txt) { if (el) el.textContent = txt; }

  function miniOwn(root, form, input, stage, status) {
    var svg = sv('svg', { viewBox: '0 0 640 300', preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': 'An overseer blob and the agents it splits the task into' }, stage);
    var threads = sv('g', {}, svg), over = null, workers = [], waiting = -1, yes = null, running = false, loopH = null;
    function words(s, n) { return s.split(/\s+/).slice(0, n).join(' '); }
    function split(text) {
      var parts = text.split(/,|;|\.|\band\b|\bthen\b/i).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 1; });
      if (parts.length < 3) {
        var extra = ['Check the result', 'Report back'];
        parts = parts.concat(extra).slice(0, Math.max(3, parts.length + 1));
      }
      return parts.slice(0, 4).map(function (p) {
        p = p.charAt(0).toUpperCase() + p.slice(1);
        return { title: words(p, 3), brief: words(p, 9) };
      });
    }
    function wrap(s, max) {
      var out = [], line = '';
      s.split(' ').forEach(function (w) { if ((line + ' ' + w).trim().length > max) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); });
      if (line) out.push(line); return out.slice(0, 2);
    }
    function draw(t) {
      if (over) over.body.setAttribute('d', blobD(over.r, 3.1, t, 0.045));
      workers.forEach(function (w, i) { w.cell.body.setAttribute('d', blobD(w.cell.r, i * 1.9, t, w.state === 'waiting' ? 0.07 : 0.04)); });
    }
    function build() {
      while (svg.childNodes.length > 1) svg.removeChild(svg.lastChild);
      threads.innerHTML = ''; workers = []; waiting = -1;
      if (yes) { yes.remove(); yes = null; }
      over = makeCell(svg, 120, 150, 46, 3.1, { sw: 2.5 });
      sv('text', { x: 120, y: 222, 'text-anchor': 'middle', 'font-size': 11 }, svg).textContent = 'overseer';
    }
    function run(text) {
      if (running) return; running = true;
      build();
      var tasks = split(text), n = tasks.length;
      setStatus(status, 'The overseer splits the work into ' + n + ' briefs.');
      var ys = tasks.map(function (_, i) { return n === 1 ? 150 : 52 + i * (196 / (n - 1)); });
      tasks.forEach(function (t, i) {
        var g = sv('g', {}, svg);
        var cell = makeCell(g, 0, 0, 22, i * 1.9 + 1, { sw: 2 });
        var th = sv('path', { d: '', fill: 'none', stroke: 'var(--line-strong)', 'stroke-width': 1 }, threads);
        var lab = sv('text', { 'font-size': 11, 'font-weight': 600, opacity: 0 }, svg), lines = wrap(t.brief, 22);
        lab.setAttribute('x', 0); lab.setAttribute('y', 0);
        var tt = sv('tspan', { x: 0, dy: 0 }, lab); tt.textContent = t.title;
        lines.forEach(function (ln, k) { var ts = sv('tspan', { x: 0, dy: 13, 'font-weight': 400, 'font-size': 10 }, lab); ts.textContent = ln; ts.setAttribute('fill', 'var(--fg-mute)'); });
        var st = sv('text', { 'font-size': 10, opacity: 0, fill: 'var(--fg-mute)' }, svg);
        workers.push({ g: g, cell: cell, th: th, lab: lab, st: st, ty: ys[i], tx: 400, state: 'running', title: t.title });
      });
      waiting = n - 1; workers[waiting].state = 'waiting';
      eyesState(over, true);
      tween(900, function (k) {
        workers.forEach(function (w) {
          var x = 120 + (w.tx - 120) * k, y = 150 + (w.ty - 150) * k;
          w.cell.setPos(x, y);
          w.th.setAttribute('d', 'M120 150 Q ' + ((120 + x) / 2) + ' ' + (150 + (y - 150) * 0.2) + ' ' + x + ' ' + y);
          w.lab.setAttribute('transform', 'translate(' + (x + 36) + ' ' + (y - 4) + ')'); w.lab.setAttribute('opacity', k);
          w.st.setAttribute('transform', 'translate(' + (x + 36) + ' ' + (y + 34) + ')'); w.st.setAttribute('opacity', k);
        });
      }, function () {
        workers.forEach(function (w, i) {
          w.st.textContent = w.state === 'waiting' ? 'waiting for your yes' : 'working';
          if (w.state === 'waiting') { w.cell.body.setAttribute('stroke-dasharray', '5 4'); w.cell.body.setAttribute('stroke-width', 2.5); }
        });
        yes = h('button', { type: 'button', class: 'fx-btn fx-btn-solid fx-yes' }, 'Yes');
        yes.setAttribute('aria-label', 'Yes, let ' + workers[waiting].title + ' go ahead');
        yes.addEventListener('click', function () {
          var w = workers[waiting]; w.state = 'running'; w.st.textContent = 'working, one action approved';
          w.cell.body.removeAttribute('stroke-dasharray'); yes.remove(); yes = null;
          setStatus(status, 'Your yes covers one action. All ' + workers.length + ' agents are working.');
        });
        stage.appendChild(yes); running = false;
        setStatus(status, n + ' agents have their briefs. "' + workers[waiting].title + '" waits for your yes.');
      });
      draw(0);
    }
    form.addEventListener('submit', function (e) { e.preventDefault(); var v = input.value.trim() || input.placeholder; run(v); });
    $$('[data-ex]', form).forEach(function (b) { b.addEventListener('click', function () { input.value = b.getAttribute('data-ex'); run(input.value); }); });
    build(); eyesState(over, false);
    /* Ruhezustand: einzelne Zelle schläft, atmet */
    if (!reduced) loopH = loop(function () { draw(performance.now() / 1000); }, stage);
    else draw(0);
  }

  function initMini() {
    var root = $('#F1'); if (!root) return;
    var form = $('[data-mini-form]', root), input = $('input[type=text]', form), stage = $('[data-mini-stage]', root), status = $('[data-mini-status]', root);
    miniOwn(root, form, input, stage, status);
  }
  initMini();
})();
</script>
</body>
</html>
