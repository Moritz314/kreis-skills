<!doctype html>
<!--
Kennung:  F7
Name:     Ablaufprotokoll
Zweck:    Ein Beispiel-Lauf wird Zeile für Zeile abgespielt, drei Prüfpunkte des Kritikers leuchten dabei auf.
Herkunft: plasmind Elementeschau 2026-10-03 (Featureseite)
Bedienung: Replay spielt neu ab; ein Prüfpunkt antippen zeigt, worauf er schaut. Startet beim Sichtbarwerden von selbst.
Aufbau:   ein Dokument, CSS und JS inline, keine externen Abrufe, keine Abhängigkeit von plasmind.js oder base.css.
          Dunkel ist Standard, ?theme=light schaltet auf hell.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F7 Ablaufprotokoll</title>
<script>
(function(){try{if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();
</script>
<style>
/* Tokens (aus tokens.css) */
:root{
  color-scheme: dark;
  /* Dunkelfeld (Standard). Hue 262, kein reines Schwarz/Weiss. */
  --bg:          oklch(0.085 0.008 262);
  --bg-sunk:     oklch(0.052 0.008 262);
  --surface:     oklch(0.115 0.008 262);
  --surface-2:   oklch(0.15 0.008 262);
  --surface-3:   oklch(0.185 0.008 262);
  --line:        oklch(0.235 0.008 262);
  --line-strong: oklch(0.37 0.008 262);
  --fg-mute:     oklch(0.62 0.008 262);
  --fg-soft:     oklch(0.8 0.004 262);
  --fg:          oklch(0.975 0.004 262);
  --cell-fill:   oklch(0.098 0.008 262);
  --flood:       oklch(0.97 0.004 262);
  --shadow:      oklch(0.02 0.008 262 / 0.55);
  --inv-bg: var(--fg);   /* Umkehrfläche: hell auf dunkel */
  --inv-fg: var(--bg);

  /* Zeichenfarben des Logos (Hex aus dem Logo-Generator w12.py) */
  --mark-hell:  #F5F7F9;
  --mark-dunkel:#050608;
  --splash-grund:#020203;

  /* Textauswahl W2d2 */
  --sel-bg:   oklch(0.27 0.006 262);
  --sel-edge: 6px;      /* Kantenbreite */
  --sel-edge-a: 0.55;   /* Kantendeckkraft */

  /* Cursor / Ladezeichen (Blob-Füllung) */
  --pm-fill: oklch(0.17 0.006 262);
  --pm-fill-a: 0.88;

  /* Schrift: Martian Mono für alles, Größenausgleich über x-Höhe (PUNKT-33) */
  --font: "Martian Mono", ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --fsa: 0.516;         /* font-size-adjust: x-Höhe von IBM Plex; Martian Mono x-Höhe 0,600 = Faktor 0,86 */

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 420ms;
  --r-ctl: 4px;
  --r-tile: 8px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:          oklch(0.962 0.005 262);
  --bg-sunk:     oklch(0.985 0.005 262);
  --surface:     oklch(0.982 0.005 262);
  --surface-2:   oklch(0.935 0.005 262);
  --surface-3:   oklch(0.905 0.005 262);
  --line:        oklch(0.855 0.005 262);
  --line-strong: oklch(0.72 0.005 262);
  --fg-mute:     oklch(0.47 0.005 262);
  --fg-soft:     oklch(0.3 0.006 262);
  --fg:          oklch(0.12 0.006 262);
  --cell-fill:   oklch(0.978 0.005 262);
  --flood:       oklch(0.97 0.006 262);
  --shadow:      oklch(0.3 0.005 262 / 0.18);
  --pm-fill: oklch(0.978 0.005 262);
  --sel-bg:  oklch(0.86 0.006 262);  /* Hellfeld ist in der Marke nicht festgelegt: eigene Annahme */
}
::selection{
  background: var(--sel-bg);
  color: var(--fg);
  text-shadow: 0 0 6px oklch(0.975 0.004 262 / 0.9), 0 0 14px oklch(0.975 0.004 262 / 0.5);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color:var(--fg);font-family:"Martian Mono",ui-monospace,monospace;font-size-adjust:var(--fsa);font-weight:400}
body{margin:0;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.65;min-height:100vh}
img,svg,canvas{max-width:100%}
h1,h2,h3,p,ul,ol,dl,figure{margin:0}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:2px}
button,input,textarea{font:inherit}
.stage{max-width:760px;margin:0 auto;padding:24px 16px 40px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:0ms!important}}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:12px;font-weight:500;color:var(--fg);background:transparent;border:1px solid var(--line-strong);border-radius:var(--r-ctl);min-height:36px;padding:0 16px;text-decoration:none;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast)}
.knopf:hover{background:var(--surface-2);border-color:var(--fg-mute)}
.knopf--voll{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.knopf--voll:hover{background:var(--fg-soft);border-color:var(--fg-soft)}
.knopf[disabled]{opacity:.45;cursor:not-allowed;border-style:dashed}
.knopf--link{border:0;padding:4px 0;min-height:0;background:none;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:.3em;font-weight:400;color:var(--fg-mute)}
.knopf--link:hover{color:var(--fg);background:none}
.pille{font:inherit;font-size:11px;color:var(--fg-soft);background:transparent;border:1px solid var(--line-strong);border-radius:99px;padding:6px 12px;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast)}
.pille:hover{background:var(--surface-2);border-color:var(--fg-mute)}
input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-ctl);padding:8px 12px;min-height:38px;width:100%}
input::placeholder{color:var(--fg-mute)}
input[type=range]{width:100%;accent-color:var(--fg)}
.fx-demo{margin:0;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--surface);min-width:0;overflow:clip}
.fx-bar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.fx-id{font-weight:600;min-width:2.4em;padding:2px 8px;border:1px solid var(--fg);border-radius:var(--r-ctl);line-height:1.4;text-align:center}
.fx-art{color:var(--fg-soft);flex:1;min-width:10em}
.fx-body{padding:clamp(16px,3vw,32px);min-width:0}
.fx-foot{display:flex;gap:16px;align-items:center;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--fg-mute);flex-wrap:wrap}
.fx-ex{white-space:nowrap}
.fx-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0}
.fx-lab{display:block;margin:0 0 8px;font-size:11px;letter-spacing:.06em;color:var(--fg-mute)}
.fx-input{width:100%;min-height:38px;padding:8px 12px;background:var(--bg);font-size:12px}
.fx-row .fx-input{flex:1;min-width:12em;width:auto}
.fx-area{resize:vertical;line-height:1.6}
.fx-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.fx-status{margin:18px 0 0;min-height:1.6em;font-size:12px;line-height:1.6;color:var(--fg-soft)}
.fx-hint{margin:0 0 20px;font-size:12px;line-height:1.7;color:var(--fg-mute)}
.fx-state{font-size:12px;color:var(--fg-mute)}
.fx-badge{display:inline-block;margin:0 0 20px;padding:4px 12px;border:1px dashed var(--line-strong);border-radius:99px;font-size:11px;color:var(--fg-soft)}
.fx-prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px}
.fx-prog i{display:block;height:100%;width:0;background:var(--fg);transform-origin:left}
.fx-stand{display:inline-block;padding:1px 9px;border:1px solid var(--line-strong);border-radius:99px;font-size:11px;color:var(--fg-soft);line-height:1.6}
.fx-stand[data-stand="planned"]{border-style:dashed}
/* F7 */
.fx-track{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fx-mark{width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:transparent;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:11px;line-height:1.5;color:var(--fg-mute)}
.fx-mark i{flex:none;width:12px;height:12px;margin-top:2px;border-radius:50%;border:1px solid var(--line-strong)}
.fx-mark.is-hit{color:var(--fg);border-color:var(--line-strong)}
.fx-mark.is-hit i{background:var(--fg);border-color:var(--fg)}
.fx-mark.is-open{border-color:var(--fg)}
.fx-log{margin:0;padding:16px 18px;min-height:230px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--bg-sunk);font-size:11px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.fx-log span{display:block;opacity:0;transform:translateY(4px);transition:opacity var(--dur) var(--ease-out),transform var(--dur) var(--ease-out)}
.fx-log span.on{opacity:1;transform:none}
.fx-log .t{color:var(--fg-mute);margin-right:10px;font-style:normal}
.fx-log .ck{color:var(--fg);font-weight:600}
@media (max-width:600px){.fx-track{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main class="stage">
<figure class="fx-demo" id="F7" data-fx="log" aria-labelledby="F7-t">
      <div class="fx-bar"><span class="fx-id">F7</span><span class="fx-art" id="F7-t">Run log, replayed line by line</span></div>
      <div class="fx-body">
        <ol class="fx-track" data-log-track aria-label="The three checks">
          <li><button type="button" class="fx-mark" data-check="0"><i></i><span>Before the build</span></button></li>
          <li><button type="button" class="fx-mark" data-check="1"><i></i><span>Before a large package is accepted</span></button></li>
          <li><button type="button" class="fx-mark" data-check="2"><i></i><span>Before anything irreversible</span></button></li>
        </ol>
        <pre class="fx-log" data-log tabindex="0" aria-label="Run log, example data"></pre>
        <p class="fx-status" data-log-status role="status" aria-live="polite">Press Replay. Tap a check to see what it looks at.</p>
        <p class="fx-row"><button class="knopf" type="button" data-log-replay>Replay</button></p>
      </div>
      <div class="fx-foot"><span class="fx-ex">example data</span></div>
    </figure>
</main>
<script>
(function () {
  'use strict';
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function h(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function once(el, fn, margin) {
    var io = new IntersectionObserver(function (es) {
      if (es[0].isIntersecting) { io.disconnect(); fn(); }
    }, { rootMargin: margin || '0px' });
    io.observe(el);
  }
  function setStatus(el, txt) { if (el) el.textContent = txt; }

  function initLog() {
    var root = $('#F7'); if (!root) return;
    var log = $('[data-log]', root), marks = $$('.fx-mark', root), st = $('[data-log-status]', root), btn = $('[data-log-replay]', root);
    var L = [
      ['09:00:01', 'overseer', 'plan drafted, 4 steps, 3 agents'],
      ['09:00:02', 'critic', 'check 1, before the build: step 3 is unclear, plan sent back', 0],
      ['09:00:04', 'overseer', 'plan changed, step 3 names the file'],
      ['09:00:05', 'critic', 'plan accepted'],
      ['09:00:06', 'worker-1', 'reads tariffs.csv'],
      ['09:00:09', 'worker-1', 'writes tariffs.json, 34 lines changed'],
      ['09:00:10', 'worker-2', 'runs the tests, 12 of 12 pass'],
      ['09:00:11', 'critic', 'check 2, before the package is accepted: totals match the source', 1],
      ['09:00:12', 'leader', 'package accepted'],
      ['09:00:13', 'approval', 'publish needs your yes, 1 action'],
      ['09:00:14', 'critic', 'check 3, before anything irreversible: target and content match the brief', 2],
      ['09:00:20', 'you', 'yes'],
      ['09:00:21', 'worker-3', 'published, 1 action, the yes is used up']
    ];
    var desc = ['Before the build the critic reads the plan and the briefs. It looks for unclear steps and missing limits.',
      'Before a large package is accepted the critic compares the work with the brief and the source.',
      'Before anything that cannot be undone the critic checks that target and content match what was asked.'];
    var rows = L.map(function (r) {
      var s = h('span'); s.appendChild(h('i', { class: 't' }, r[0])); s.appendChild(document.createTextNode(r[1].padEnd(9) + ' ' + r[2]));
      if (r[3] != null) s.classList.add('ck'); log.appendChild(s); return s;
    });
    var timer = null;
    function clear() { clearTimeout(timer); rows.forEach(function (r) { r.classList.remove('on'); }); marks.forEach(function (m) { m.classList.remove('is-hit'); }); }
    function showRow(i) {
      rows[i].classList.add('on'); if (L[i][3] != null) marks[L[i][3]].classList.add('is-hit');
      log.scrollTop = log.scrollHeight;
    }
    function play() {
      clear(); setStatus(st, 'Replaying an example run.');
      if (reduced) { rows.forEach(function (_, i) { showRow(i); }); setStatus(st, 'Example run, all lines shown. Tap a check to see what it looks at.'); return; }
      var i = 0;
      (function nx() { showRow(i); i++; if (i < rows.length) timer = setTimeout(nx, 480); else setStatus(st, 'Run finished. Tap a check to see what it looks at.'); })();
    }
    btn.addEventListener('click', play);
    marks.forEach(function (m, i) { m.addEventListener('click', function () { marks.forEach(function (x) { x.classList.remove('is-open'); }); m.classList.add('is-open'); setStatus(st, 'Check ' + (i + 1) + '. ' + desc[i]); }); });
    var started = false;
    once(root, function () { started = true; play(); }, '-80px');
  }
  initLog();
})();
</script>
</body>
</html>
