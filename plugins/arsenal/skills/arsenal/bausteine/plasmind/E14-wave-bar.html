<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E14 Wave bar</title>
<!--
Baustein E14: Wave bar
Zweck: A progress bar as one calm body with a wave running through its thickness, no parts leave the front.
Herkunft: plasmind Elementeschau 2026-10-03 (<studio>, eigenes Werk).
In sich geschlossen: CSS und JS inline, keine externen Abrufe. Farben ueber die CSS-Variablen im Tokenblock
(dunkel, hell ueber [data-theme=light]); die Schrift faellt auf ui-monospace zurueck.
API: PMEL.E14.init(el,{theme:'dark'|'light'}) liefert ein Handle mit setTheme(t) und destroy()
(set(name,wert) fuer Optionen, falls vorhanden). el braucht position:relative und eine Hoehe.
Pausiert ausserhalb des Bildschirms und im verdeckten Tab, Standbild bei prefers-reduced-motion.
URL-Parameter: ?theme=light
-->
<style>
/* Tokenblock */
:root{
  color-scheme: dark;
  
  --bg:          oklch(0.085 0.008 262);
  --bg-sunk:     oklch(0.052 0.008 262);
  --surface:     oklch(0.115 0.008 262);
  --surface-2:   oklch(0.15 0.008 262);
  --surface-3:   oklch(0.185 0.008 262);
  --line:        oklch(0.235 0.008 262);
  --line-strong: oklch(0.37 0.008 262);
  --fg-mute:     oklch(0.62 0.008 262);
  --fg-soft:     oklch(0.8 0.004 262);
  --fg:          oklch(0.975 0.004 262);
  --cell-fill:   oklch(0.098 0.008 262);
  --flood:       oklch(0.97 0.004 262);
  --shadow:      oklch(0.02 0.008 262 / 0.55);
  --inv-bg: var(--fg);   
  --inv-fg: var(--bg);

  
  --mark-hell:  #F5F7F9;
  --mark-dunkel:#050608;
  --splash-grund:#020203;

  
  --sel-bg:   oklch(0.27 0.006 262);
  --sel-edge: 6px;      
  --sel-edge-a: 0.55;   

  
  --pm-fill: oklch(0.17 0.006 262);
  --pm-fill-a: 0.88;

  
  --font: "Martian Mono", ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --fsa: 0.516;         

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 420ms;
  --r-ctl: 4px;
  --r-tile: 8px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:          oklch(0.962 0.005 262);
  --bg-sunk:     oklch(0.985 0.005 262);
  --surface:     oklch(0.982 0.005 262);
  --surface-2:   oklch(0.935 0.005 262);
  --surface-3:   oklch(0.905 0.005 262);
  --line:        oklch(0.855 0.005 262);
  --line-strong: oklch(0.72 0.005 262);
  --fg-mute:     oklch(0.47 0.005 262);
  --fg-soft:     oklch(0.3 0.006 262);
  --fg:          oklch(0.12 0.006 262);
  --cell-fill:   oklch(0.978 0.005 262);
  --flood:       oklch(0.97 0.006 262);
  --shadow:      oklch(0.3 0.005 262 / 0.18);
  --pm-fill: oklch(0.978 0.005 262);
  --sel-bg:  oklch(0.86 0.006 262);  
}

html{
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size-adjust: var(--fsa);
  font-weight: 400;
}
body{ margin:0; background:var(--bg); color:var(--fg); }


::selection{
  background: var(--sel-bg);
  color: var(--fg);
  text-shadow: 0 0 6px oklch(0.975 0.004 262 / 0.9), 0 0 14px oklch(0.975 0.004 262 / 0.5);
}
:root[data-theme="light"] ::selection{ text-shadow:none; }
.pm-sel-aktiv ::selection, .pm-sel-aktiv::selection{ background: transparent; } 

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0ms !important; }
}
/* Seitengeruest der Demo */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-size:13px;line-height:1.6}
.bar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar b{font-weight:600}.bar span{color:var(--fg-mute);font-size:12px}.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-ctl);overflow:hidden}
.seg button{font:500 12px/1 var(--font);padding:7px 11px;border:0;background:transparent;color:var(--fg-soft);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.opt{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--fg-soft);cursor:pointer}
.opt input{accent-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
#stage{position:relative;overflow:hidden;flex:1;min-height:240px;background:var(--bg-sunk)}
</style>
